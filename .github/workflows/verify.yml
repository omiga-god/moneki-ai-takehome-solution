name: Verify take-home
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: starter/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r starter/requirements.txt
      - run: python -m pytest starter/tests -q
      - run: npm ci && npm run build && npm audit --audit-level=low
        working-directory: frontend
      - run: python scripts/verify.py eval
      - run: python scripts/verify.py preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            starter/var/audit-eval/report.*
            starter/var/audit-preflight/preflight_report.*
